<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus IT Repair Hub - Services</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="site-title">
        <span class="primary">Campus IT</span> <span class="accent">Repair Hub</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link active">Services & Pricing</a>
        <a href="/book.html" class="nav-link">Book Service</a>
        <a href="/status.html" class="nav-link">Check Booking Status</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="card">
      <h1 style="font-size: 1.5rem; margin-bottom: var(--space-xs);">Available Repair Services</h1>
      <p style="color: var(--text-muted); margin-bottom: var(--space-md);">
        Official School IT Department Hardware & Software Repair Services
      </p>

      <div id="services-container" class="grid-services">
        <div class="state-box" style="grid-column: 1 / -1;">Loading available services...</div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    // Inline fallback so formatCurrency never throws an error
    if (typeof formatCurrency !== 'function') {
      window.formatCurrency = function(amount) {
        const num = parseFloat(amount);
        if (isNaN(num)) return "₱0.00";
        return "₱" + num.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, "$&,");
      };
    }

    if (typeof escapeHtml !== 'function') {
      window.escapeHtml = function(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      };
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("services-container");
      try {
        const res = await fetch("/api/services");
        if (!res.ok) throw new Error("Failed to load services");
        const services = await res.json();

        if (services.length === 0) {
          container.innerHTML = `<div class="state-box" style="grid-column: 1 / -1;">No repair services currently available.</div>`;
          return;
        }

        container.innerHTML = services.map(s => `
          <div class="service-card">
            <div>
              <div class="service-title">${escapeHtml(s.name)}</div>
              <div class="service-desc">${escapeHtml(s.description || "")}</div>
            </div>
            <div>
              <div class="service-price">${formatCurrency(s.price)}</div>
              <a href="/book.html?service_id=${s.id}" class="btn btn-primary">Book Service</a>
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<div class="state-box" style="grid-column: 1 / -1; color: var(--danger-color);">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
