<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus IT Repair Hub - Booking Confirmed</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="site-title">
        <span class="primary">Campus IT</span> <span class="accent">Repair Hub</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Services</a>
        <a href="/book.html" class="nav-link">Book Now</a>
        <a href="/status.html" class="nav-link">Check Status</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="card" id="confirmation-content">
      <div class="state-box">Retrieving confirmation details...</div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", loadConfirmation);

    async function loadConfirmation() {
      const container = document.getElementById("confirmation-content");
      const params = new URLSearchParams(window.location.search);
      const ref = params.get("ref");

      if (!ref) {
        container.innerHTML = `<div class="state-box" style="color: var(--danger-color);">No reference number provided.</div>`;
        return;
      }

      try {
        const res = await fetch(`/api/bookings/${encodeURIComponent(ref)}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Booking not found.");
        }

        container.innerHTML = `
          <div style="text-align: center;">
            <h1 style="font-size: 1.5rem; color: var(--accent-color); margin-bottom: var(--space-xs);">Booking Submitted!</h1>
            <p style="color: var(--text-muted); margin-bottom: var(--space-md);">Save your reference number to track status.</p>
          </div>

          <div class="ref-display">
            <div class="ref-code" id="ref-code">${escapeHtml(data.reference)}</div>
            <button id="copy-btn" class="btn btn-primary" style="width: auto;">Copy Reference Number</button>
          </div>

          <div style="border-top: 1px solid var(--border-color); padding-top: var(--space-md); margin-top: var(--space-md);">
            <h2 style="font-size: 1.1rem; margin-bottom: var(--space-sm);">Summary Details</h2>
            <p><strong>Service:</strong> ${escapeHtml(data.services ? data.services.name : "N/A")}</p>
            <p><strong>Price:</strong> ${data.services ? formatPeso(data.services.price) : "N/A"}</p>
            <p><strong>Scheduled Date:</strong> ${formatDate(data.booking_date)}</p>
            <p><strong>Scheduled Time:</strong> ${formatTime(data.booking_time)}</p>
            <p><strong>Devices:</strong> ${data.guests}</p>
            <p><strong>Client Name:</strong> ${escapeHtml(data.name)}</p>
            <p><strong>Contact:</strong> ${escapeHtml(data.contact)} (${escapeHtml(data.email)})</p>
            <p style="margin-top: var(--space-xs);"><strong>Status:</strong> <span class="status-badge status-${data.status}">${data.status}</span></p>
          </div>
        `;

        document.getElementById("copy-btn").addEventListener("click", () => {
          navigator.clipboard.writeText(data.reference).then(() => {
            showToast("Reference number copied to clipboard!", "success");
          }).catch(() => {
            showToast("Failed to copy reference number.", "error");
          });
        });

      } catch (err) {
        container.innerHTML = `<div class="state-box" style="color: var(--danger-color);">${escapeHtml(err.message)}</div>`;
        showToast(err.message, "error");
      }
    }
  </script>
</body>
</html>
