<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus IT Repair Hub - Admin Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="site-title">
        <span class="primary">Campus IT</span> <span class="accent">Repair Hub</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Main Site</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="card" style="max-width: 420px; margin: 0 auto;">
      <h1 style="margin-bottom: var(--space-md); font-size: 1.5rem; text-align: center;">Admin Portal Login</h1>
      
      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username *</label>
          <input type="text" id="username" class="form-input" placeholder="Enter admin username" required>
          <div id="username-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required>
          <div id="password-error" class="field-error"></div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="margin-top: var(--space-md);">
          Log In
        </button>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("admin-login-form").addEventListener("submit", handleLogin);
    });

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      clearAllErrors(form);

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      let isValid = true;
      if (!username) {
        setFieldError("username", "Please enter your username.");
        isValid = false;
      }
      if (!password) {
        setFieldError("password", "Please enter your password.");
        isValid = false;
      }

      if (!isValid) return;

      const loginBtn = document.getElementById("login-btn");
      setButtonLoading(loginBtn, true);

      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Invalid username or password.");
        }

        showToast("Login successful!", "success");
        window.location.href = "/admin/dashboard.html";
      } catch (err) {
        showToast(err.message, "error");
        setFieldError("username", err.message);
        setButtonLoading(loginBtn, false);
      }
    }
  </script>
</body>
</html>
