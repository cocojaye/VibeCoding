<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus IT Repair Hub - Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Responsive Table Styles */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: var(--space-md);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 800px;
    }

    .admin-table th, .admin-table td {
      padding: var(--space-md);
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .admin-table th {
      background-color: var(--bg-dark);
      color: var(--primary-color);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Summary Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .stat-card {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: var(--space-md);
      text-align: center;
    }

    .stat-card .stat-number {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: var(--space-xs);
    }

    /* Filter Controls */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    @media (min-width: 640px) {
      .controls-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .search-box {
        max-width: 300px;
      }
      .filter-box {
        max-width: 200px;
      }
    }

    /* Row Action Buttons */
    .action-group {
      display: flex;
      gap: var(--space-xs);
      flex-wrap: wrap;
    }

    .btn-action {
      min-height: 36px;
      padding: 4px 10px;
      font-size: 0.85rem;
      width: auto;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/admin/dashboard.html" class="site-title">
        <span class="primary">Campus IT</span> <span class="accent">Admin Dashboard</span>
      </a>
      <nav class="nav-links">
        <button id="logout-btn" class="btn btn-danger" style="width: auto; min-height: 38px; padding: 4px 16px;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="main-container" style="max-width: 1100px;">
    <!-- Stats Summary -->
    <div class="stats-grid">
      <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 500;">Total Bookings</div>
        <div id="stat-total" class="stat-number" style="color: var(--text-main);">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 500;">Pending</div>
        <div id="stat-pending" class="stat-number" style="color: #f59e0b;">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 500;">Confirmed</div>
        <div id="stat-confirmed" class="stat-number" style="color: var(--accent-color);">0</div>
      </div>
    </div>

    <!-- Main Table Card -->
    <div class="card">
      <div class="controls-bar">
        <div class="search-box" style="width: 100%;">
          <input type="text" id="search-input" class="form-input" placeholder="Search ref, name, contact, email...">
        </div>
        <div class="filter-box" style="width: 100%;">
          <select id="status-filter" class="form-select">
            <option value="all">All Statuses</option>
            <option value="pending">Pending Only</option>
            <option value="confirmed">Confirmed Only</option>
            <option value="cancelled">Cancelled Only</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Ref Code</th>
              <th>Service</th>
              <th>Client Info</th>
              <th>Date & Time</th>
              <th>Devices</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookings-tbody">
            <tr>
              <td colspan="7" class="state-box">Loading bookings database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let allBookings = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchBookings();

      document.getElementById("search-input").addEventListener("input", filterAndRenderBookings);
      document.getElementById("status-filter").addEventListener("change", filterAndRenderBookings);
      document.getElementById("logout-btn").addEventListener("click", handleLogout);
    });

    async function fetchBookings() {
      const tbody = document.getElementById("bookings-tbody");
      try {
        const res = await fetch("/api/admin/bookings", { credentials: "same-origin" });
        
        if (res.status === 401) {
          window.location.href = "/admin/login.html";
          return;
        }

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Failed to fetch bookings.");
        }

        allBookings = data;
        updateSummaryStats(data);
        filterAndRenderBookings();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="state-box" style="color: var(--danger-color);">${escapeHtml(err.message)}</td></tr>`;
        showToast(err.message, "error");
      }
    }

    function updateSummaryStats(bookings) {
      const total = bookings.length;
      const pending = bookings.filter((b) => b.status === "pending").length;
      const confirmed = bookings.filter((b) => b.status === "confirmed").length;

      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-pending").textContent = pending;
      document.getElementById("stat-confirmed").textContent = confirmed;
    }

    function filterAndRenderBookings() {
      const tbody = document.getElementById("bookings-tbody");
      const searchQuery = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;

      const filtered = allBookings.filter((b) => {
        const matchesStatus = statusFilter === "all" || b.status === statusFilter;
        
        const refStr = (b.reference || "").toLowerCase();
        const nameStr = (b.name || "").toLowerCase();
        const contactStr = (b.contact || "").toLowerCase();
        const emailStr = (b.email || "").toLowerCase();
        const serviceStr = (b.services ? b.services.name : "").toLowerCase();

        const matchesSearch = !searchQuery || 
          refStr.includes(searchQuery) || 
          nameStr.includes(searchQuery) || 
          contactStr.includes(searchQuery) || 
          emailStr.includes(searchQuery) || 
          serviceStr.includes(searchQuery);

        return matchesStatus && matchesSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="state-box">No bookings found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((b) => `
        <tr>
          <td><strong style="color: var(--primary-color);">${escapeHtml(b.reference)}</strong></td>
          <td>${escapeHtml(b.services ? b.services.name : "N/A")}</td>
          <td>
            <strong>${escapeHtml(b.name)}</strong><br>
            <small style="color: var(--text-muted);">${escapeHtml(b.contact)} | ${escapeHtml(b.email)}</small>
          </td>
          <td>
            ${formatDate(b.booking_date)}<br>
            <small style="color: var(--text-muted);">${formatTime(b.booking_time)}</small>
          </td>
          <td style="text-align: center;">${b.guests}</td>
          <td><span class="status-badge status-${b.status}">${b.status}</span></td>
          <td>
            <div class="action-group">
              ${b.status !== "confirmed" ? `<button onclick="updateBookingStatus('${b.id}', 'confirm')" class="btn btn-secondary btn-action">Confirm</button>` : ""}
              ${b.status !== "cancelled" ? `<button onclick="updateBookingStatus('${b.id}', 'cancel')" class="btn btn-action" style="background-color: #f59e0b; color: #000;">Cancel</button>` : ""}
              <button onclick="deleteBooking('${b.id}')" class="btn btn-danger btn-action">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    async function updateBookingStatus(id, action) {
      try {
        const res = await fetch(`/api/admin/bookings/${id}/${action}`, {
          method: "PATCH",
          credentials: "same-origin"
        });

        if (res.status === 401) {
          window.location.href = "/admin/login.html";
          return;
        }

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `Failed to ${action} booking.`);
        }

        showToast(`Booking ${action}ed successfully!`, "success");
        fetchBookings();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function deleteBooking(id) {
      if (!confirm("Are you sure you want to permanently delete this booking record?")) return;

      try {
        const res = await fetch(`/api/admin/bookings/${id}`, {
          method: "DELETE",
          credentials: "same-origin"
        });

        if (res.status === 401) {
          window.location.href = "/admin/login.html";
          return;
        }

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Failed to delete booking.");
        }

        showToast("Booking deleted successfully.", "success");
        fetchBookings();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function handleLogout() {
      try {
        await fetch("/api/admin/logout", {
          method: "POST",
          credentials: "same-origin"
        });
        showToast("Logged out successfully.", "success");
        window.location.href = "/admin/login.html";
      } catch (err) {
        showToast("Logout failed.", "error");
      }
    }
  </script>
</body>
</html>
